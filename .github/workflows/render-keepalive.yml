name: Render keepalive

# Free Render web services sleep after ~15 idle minutes. This ping keeps the
# dashboard awake so it actually responds 24/7. Set the repo secret RENDER_URL
# (e.g. https://meme-engine-web.onrender.com) to enable it.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping dashboard
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        if: env.RENDER_URL != ''
        run: |
          curl -fsS --max-time 40 "$RENDER_URL/api/status" > /dev/null
          echo "dashboard alive"
