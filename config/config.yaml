chains:
  solana:
    enabled: true
    rpc_url: "https://mainnet.helius-rpc.com/?api-key=${HELIUS_API_KEY}"
    ws_url: "wss://mainnet.helius-rpc.com/?api-key=${HELIUS_API_KEY}"
    # Helius free plan rejects WS with HTTP 429 (verified 2026-11-16). The scout
    # walks this list until one connects; these two public WS endpoints answered
    # logsSubscribe live.
    ws_fallback_urls:
      - "wss://solana-rpc.publicnode.com"
      - "wss://api.mainnet-beta.solana.com"
    # HTTP RPC fallbacks for the vet agents. When Helius returns "account index
    # overloaded", getAccountInfo still answers on these (verified 2026-11-16).
    rpc_fallback_urls:
      - "https://solana-rpc.publicnode.com"
      - "https://api.mainnet-beta.solana.com"
    private_key: "${SOLANA_PRIVATE_KEY}"
    # Legacy quote-api.jup.ag/v6 is DNS-dead; lite-api is the live exact-in quote host.
    jupiter_api: "https://lite-api.jup.ag/swap/v1"
    pump_fun_program: "6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P"
    helius_api_key: "${HELIUS_API_KEY}"
    ankr_rpc: "https://rpc.ankr.com/solana/${ANKR_API_KEY}"
    # Solana early-cap: pump.fun bonding curve 2-4k mcap
    min_mcap_usd: 2000
    min_liquidity_usd: 500
    
  base:
    enabled: false  # FROZEN by director order 2026-11-11 - Solana only
    rpc_url: "https://rpc.ankr.com/base/${ANKR_API_KEY}"
    private_key: "${BASE_PRIVATE_KEY}"
    uniswap_v3_factory: "0x1F98431c8aD98523631AE4a59f267346ea31F984"
    one_inch_api: "https://api.1inch.dev/swap/v6.0"
    ankr_rpc: "https://rpc.ankr.com/base/${ANKR_API_KEY}"
    
  robinhood:
    enabled: false  # FROZEN by director order 2026-11-11 - Solana only
    rpc_url: "https://rpc.goldrushdata.com/v1/robinhood-mainnet"
    private_key: "${ROBINHOOD_PRIVATE_KEY}"
    one_inch_api: "https://api.1inch.dev/swap/v6.0"
    ankr_rpc: "https://rpc.ankr.com/arb1/${ANKR_API_KEY}"
    goldrush_chain: "robinhood-mainnet"

# Ankr Advanced API Configuration
ankr:
  api_key: "${ANKR_API_KEY}"
  base_url: "https://rpc.ankr.com/multichain"

# GoldRush (Covalent) for Robinhood Chain - Ankr has no robinhood, so use GoldRush
goldrush:
  api_key: "${GOLDRUSH_API_KEY}"
  chain: "robinhood-mainnet"  # chainId 4663  https://goldrush.dev/docs/chains/robinhood-chain
  base_url: "https://api.covalenthq.com/v1"
  # Usage: GET https://api.covalenthq.com/v1/robinhood-mainnet/address/<addr>/balances_v2/?key=<GOLDRUSH_API_KEY>
  #        GET https://api.covalenthq.com/v1/robinhood-mainnet/address/<addr>/transactions_v3/?key=<key>
  #        RPC: https://rpc.goldrushdata.com/v1/robinhood-mainnet  Header: Authorization: Bearer <key>
  # Ankr endpoints (auto-generated from api_key):
  #   Multichain: https://rpc.ankr.com/multichain/{API_KEY}
  #   Ethereum:   https://rpc.ankr.com/eth/{API_KEY}
  #   Base:       https://rpc.ankr.com/base/{API_KEY}
  #   Solana:     https://rpc.ankr.com/solana/{API_KEY}
  #   Arbitrum:   https://rpc.ankr.com/arb1/{API_KEY}
  #
  # Features used:
  #   - ankr_getTransactionsByAddress (wallet tracking)
  #   - ankr_getTokenTransfersByAddress (token transfer history)
  #   - ankr_getAccountBalance (balance checks)
  #   - ankr_getTokenPrice (price data)
  #   - ankr_getNewPairsByChain (new pair detection - EVM chains)

scout:
  new_pair:
    enabled: true
    # Base rarely has early memcap movers - poll slower, needs more early caps on robinhood to learn
    scan_interval_seconds: 30
    robinhood_scan_interval_seconds: 5
    min_liquidity_usd: 1000  # lowered from 5000 for early-cap <100k learning
    max_buy_tax: 10
    max_sell_tax: 10
    require_verified_contract: false
    blacklisted_tokens: []
    
  volume_scan:
    enabled: true
    scan_interval_seconds: 60
    robinhood_scan_interval_seconds: 30
    volume_spike_threshold: 5
    min_volume_usd: 10000
    lookback_minutes: 60
    
  smart_money:
    enabled: true
    scan_interval_seconds: 10
    tracked_wallets: []
    min_confidence: 0.7
    min_trade_size_usd: 500

# Overseer - coin-triggered wallet investigation (flexible early so we don't fade runners)
overseer:
  enabled: true
  min_overall_score: 60        # strict after 20 trades
  lenient_min_score: 45        # lenient bootstrap for first 20 trades (memes: unknown dev is normal)
  lenient_until_trades: 20
  agent_timeout_seconds: 20
  weights:  # strict
    dev: 0.35
    holders: 0.25
    kols: 0.15
    profit_wallets: 0.25
  lenient_weights:  # flexible early: less dev penalty, more holders/profit
    dev: 0.20
    holders: 0.30
    kols: 0.10
    profit_wallets: 0.40
  kols: []  # add KOL addresses here, e.g. ["0x...", "0x..."]
  # Profit wallets auto-sampled from recent buyers via DexScreener + Ankr grading
  # Dev & holders use Ankr + DexScreener (no extra config needed)

# Lookup - on boot fetch top 6h/24h coins per chain and brutal-grade wallets
lookup:
  enabled: true
  # Uses DexScreener trending + GoldRush/Ankr for wallet grading (brutal-wallet-auditor)
  # Finds reputable devs/traders (A/B grades) and auto-watches them via alert_manager

execution:
  paper_mode: true  # Phase1: demo dry-run wallet (SOL cash, honest slip+fee fills)
  default_buy_amount_usd: 25.0   # bootstrap blend base only - Kelly is the real sizer
  max_buy_amount_usd: 200.0      # guardrail cap, director tunes (was 0.25 - strangled Kelly)
  size_floor_usd: 0.0            # NO rigid floor - flexible sizing (director order 2026-11-11)
  max_slippage_percent: 5
  max_token_age_seconds: 1800   # hard buy gate; missing/unverifiable pairCreatedAt also rejects
  gas_price_multiplier: 1.2
  retry_attempts: 3
  retry_delay_seconds: 2
  mev_protection: true
  # Meme honest costs (quant-bot COMMISSION_RATE 0.10% + SLIPPAGE 5bps too low for memes)
  commission_pct: 0.30  # 0.30% per side (Jupiter/1inch fee)
  slippage_pct: 2.0     # 2% expected slippage on low-liquidity memes
  confirmation_blocks:
    solana: 1
    base: 2
    robinhood: 2

# Quant-bot risk ported to memes (C:/quant-bot/quantbot/config.py + mathlib/risk.py)
risk:
  max_position_pct: 2.0       # base cap: 2% equity per position (high rug rate)
  confidence_scaling:         # director order 2026-11-11: flexible, confidence can step risk UP
    enabled: true
    high_score: 80            # score >= 80 -> cap steps to 5%
    high_cap_pct: 5.0
    very_high_score: 90       # score >= 90 -> cap steps to 10% (max)
    very_high_cap_pct: 10.0
  kelly_fraction: 0.25        # quarter-Kelly (risk.py:27 fractional=0.25)
  target_vol: 0.40            # vol_target_weight target 40% annual (memes: 200% vol -> 0.2 weight)
  atr_stop_mult: 1.8          # atr_stop mult (quant 2.5 -> 1.8 tighter for meme moon/dusk)
  atr_trailing_mult: 1.8      # trailing = peak - ATR*1.8 (dynamic, not fixed 20%)
  atr_period: 14
  max_daily_dd_pct: 8.0       # RISK_MAX_DAILY_DD_PCT 8.0 hard halt
  soft_dd_pct: 3.0            # RISK_SOFT_DD_PCT 3.0 halve size
  max_open_positions: 10

exit:
  tiers:
    - multiplier: 2
      sell_percent: 25
    - multiplier: 5
      sell_percent: 25
    - multiplier: 10
      sell_percent: 25
    
  trailing_stop:
    enabled: true
    callback_percent: 20          # fallback fixed callback
    atr_trailing_mult: 1.8        # primary: ATR-based trailing
    min_profit_before_trailing: 50
    
  time_exit:
    enabled: true
    max_hold_hours: 24
    emergency_exit_loss_percent: 20  # Phase4 hard kill-switch 20% overriding AI
    check_interval_seconds: 10

portfolio:
  initial_capital: 20.0        # demo book baseline ~= 0.1 SOL in USD (sizing % scale honestly off this)
  max_concurrent_positions: 10
  min_position_size_usd: 0.0   # flexible: no $10 floor (was silently clamping every buy to $10)
  database_path: "data/trades.db"
  auto_compound: false
  min_score: 60  # scout score threshold (raise from 50 to 60 for memes)

# Demo (dry-run) wallet - Solana only, honest fills
paper:
  initial_sol: 0.1             # starting demo cash (SOL) - director set 2026-11-11
  slippage_pct: 2.0            # applied AGAINST us on every fill (up on buys, down on sells)
  slippage_bps: 200            # exact-in Jupiter slippage tolerance
  fee_pct: 0.30                # DEX fee taken on every fill
  fallback_sol_usd: 72.0       # bootstrap only - live SOL mark is fetched at boot and every minute
  reset_on_boot: false         # PERSIST the book across restarts (director: lifetime P&L must accumulate; exit manager rehydrates open positions from db)
  ledger_db_path: "data/wallet_ledger.db"
  legacy_state_path: "data/demo_wallet.json"
  jupiter_quote_url: "https://api.jup.ag/swap/v1"

# Graduation-entry scanner - Sol's core edge (director 2026-11-14)
# Buy at PumpSwap migration; backtest n=250 honest: hold24h+stop30 June +112% / July +60% EV;
# GT-open == real first-trade-price validated live. Security vet is HARD (mint/freeze revoked or no trade).
grad_entry:
  enabled: true
  score: 75                    # feeds the confidence ladder (75 -> base 2% cap)
  risk_mult:
    base_pct: 5.0              # base risk cap 5% of equity per grad trade
    high_score: 80             # score >= 80 -> 8%
    high_pct: 8.0
    very_high_score: 90        # score >= 90 -> 10% (max)
    very_high_pct: 10.0
  quote_timeout_seconds: 90    # wait for Jupiter to route the fresh pool (never buy blind)
  quote_poll_seconds: 3
  quote_probe_sol: 0.01        # probe size used to derive the executable entry price
  max_mcap_usd: 0              # 0 = no mcap cap (edge is the event itself)
  min_liquidity_usd: 0         # 0 = disabled; set >0 to filter low-liq grads (backtest first)
  # Exit profile for graduation trades (config gated; default off until backtest-validated)
  exit_profile:
    enabled: false
    stop_pct: 30               # fixed 30% stop from entry
    hold_hours: 24             # time exit
    tiers:
      - multiplier: 2
        sell_pct: 25
      - multiplier: 5
        sell_pct: 25
      - multiplier: 10
        sell_pct: 25
    trail_after_mult: 2        # trail only after 2x
    trail_pct: 20

telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"

logging:
  level: "INFO"
  file: "data/engine.log"
  max_size_mb: 10
  backup_count: 5
